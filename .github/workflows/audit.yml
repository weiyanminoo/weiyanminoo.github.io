name: Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate: what this runner can measure honestly.
      - run: npm test
      - run: npm run build
      # The audit is a report here, not a gate. It measures the dive's
      # rendered pixels, which takes WebGL, and this runner has no GPU:
      # headless Chromium gives it no WebGL at all, the film falls back to
      # its stills and the instrument self-check times out. It is run
      # before every ship on a machine with a GPU (scripts/audit), where
      # every check passes; here its output is kept for reading.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit/index.mjs
        continue-on-error: true
